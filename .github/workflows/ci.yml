name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run automated tests
        run: node --test test/*.test.mjs

      - name: Verify portable sync package
        run: node scripts/sync-plugin.mjs --portable-only
